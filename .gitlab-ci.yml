# GitLab CI/CD — build the Next.js static export and publish it to GitLab Pages.
#
# The app uses `output: "export"` (see next.config.ts), so `next build` emits a
# fully static site into `out/`. GitLab Pages serves whatever a job named
# `pages` places in the `public/` artifact, so we rename `out` -> `public`.
#
# NOTE: this project depends on a private/modified Next.js and the private
# eco v2 (DTN) component registry. If `npm ci` fails on the runner with a
# 401/404 fetching those packages, the runner needs registry credentials
# (e.g. a project CI variable + an .npmrc). That's an infra step on your side;
# the build logic below is otherwise complete.

image: node:20

pages:
  stage: deploy
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - rm -rf public
    - mv out public
  artifacts:
    paths:
      - public
  rules:
    # Only deploy from the default branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
