# GitLab CI/CD — build the Next.js static export and publish it to GitLab Pages.
#
# The app uses `output: "export"` (see next.config.ts), so `next build` emits a
# fully static site into `out/`. GitLab Pages serves whatever a job named
# `pages` places in the `public/` artifact, so we rename `out` -> `public`.
#
# next.config.ts derives basePath from CI_PAGES_URL automatically, so the app's
# asset/link paths resolve correctly regardless of how deep the group path is
# (e.g. https://dtnse.gitlab.io/ux/weather/weatherhub-prototypes/).

image: node:20

pages:
  stage: deploy
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - rm -rf public
    - mv out public
  artifacts:
    paths:
      - public
  rules:
    # Only deploy from the default branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
